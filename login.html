<h2>Test Login Firebase</h2>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <br/>
  <button id="registerBtn">Registrati</button>
  <button id="loginBtn">Accedi</button>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

  // Configurazione Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCmEiPbdLOXu7kb_QdxMYLln1xTRm3Fj0Q",
    authDomain: "arenagiovanifriulioccidentale.firebaseapp.com",
    projectId: "arenagiovanifriulioccidentale",
    storageBucket: "arenagiovanifriulioccidentale.appspot.com",
    messagingSenderId: "490862063657",
    appId: "1:490862063657:web:58c0f7df6b46e6f894ac38",
    measurementId: "G-CM1Z918EK3"
  };

  // Inizializza Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);

  // Eventi registrazione e login
  document.getElementById('registerBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      alert("✅ Registrazione effettuata: " + userCredential.user.email);
    } catch (error) {
      alert("❌ Errore registrazione: " + error.message);
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      alert("✅ Login effettuato: " + userCredential.user.email);
    } catch (error) {
      alert("❌ Errore login: " + error.message);
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("👋 Utente loggato:", user.email);
      alert("Sei loggato come " + user.email);
    } else {
      console.log("❌ Nessun utente loggato");
    }
  });
</script>
