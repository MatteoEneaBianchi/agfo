<h2>Test Login Firebase</h2>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <br/>
  <button id="registerBtn">Registrati</button>
  <button id="loginBtn">Accedi</button>

<script>

  import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const registerBtn = document.getElementById('registerBtn');
const loginBtn = document.getElementById('loginBtn');

registerBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    alert("✅ Registrazione effettuata: " + userCredential.user.email);
  } catch (error) {
    alert("❌ Errore registrazione: " + error.message);
  }
});

loginBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    alert("✅ Login effettuato: " + userCredential.user.email);
  } catch (error) {
    alert("❌ Errore login: " + error.message);
  }
});



import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (user) {
    console.log("👋 Utente loggato:", user.email);
    alert("Sei loggato come " + user.email);
    // Qui puoi fare:
    // window.location.href = '/dashboard.html';
  } else {
    console.log("❌ Nessun utente loggato");
  }
});


  
</script>
